appId: ai.deepseek.harness
productName: DeepSeek Harness
electronVersion: 43.4.0
artifactName: DeepSeek-Harness-${version}-${os}-${arch}.${ext}
asar: false
compression: normal
# Native dependencies use stable Node-API; package.mjs verifies their actual
# operations in the staged and packaged Electron runtimes before signing.
npmRebuild: false
directories:
  buildResources: build
  output: ../desktop
files:
  - lib/**
  - package.json
  - '!**/*.map'
mac:
  category: public.app-category.developer-tools
  icon: build/icon.svg
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  target:
    - dmg
    - zip
win:
  icon: build/icon.svg
  target:
    - nsis
    - zip
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: Development
  icon: build/icon.svg
  executableName: deepseek-harness
  maintainer: lonesafe <lonesafe@users.noreply.github.com>
  synopsis: DeepSeek Harness desktop client
  description: Cross-platform desktop client for DeepSeek Harness
  target:
    - AppImage
    - deb
