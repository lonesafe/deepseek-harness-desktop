# Build the Electron client on each target operating system so pnpm installs
# that platform's native runtime dependencies before electron-builder packages
# the staged production closure. Artifacts are unsigned unless signing secrets
# are configured in a future release workflow.
name: Desktop installers

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
            platform: mac
            arch: arm64
            artifact: macos-arm64
          - name: macOS x64
            runner: macos-15-intel
            platform: mac
            arch: x64
            artifact: macos-x64
          - name: Linux x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            artifact: linux-x64
          - name: Windows x64
            runner: windows-2025
            platform: windows
            arch: x64
            artifact: windows-x64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build and stage the desktop runtime
        run: pnpm run desktop:prepare

      - name: Package the native installers
        run: node apps/desktop/scripts/package.mjs ${{ matrix.platform }} ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-${{ matrix.artifact }}
          path: |
            dist/desktop/*.dmg
            dist/desktop/*.zip
            dist/desktop/*.AppImage
            dist/desktop/*.deb
            dist/desktop/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Attach installers to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/desktop/scripts/upload-release.mjs
