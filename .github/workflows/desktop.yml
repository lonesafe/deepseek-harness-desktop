# Build the Electron client on each target operating system so pnpm installs
# that platform's native runtime dependencies before electron-builder packages
# the staged production closure. macOS jobs sign and notarize when the complete
# Apple credential set is available, and otherwise still publish an explicitly
# unsigned artifact. A partial credential set fails because its intent is
# ambiguous and likely indicates a configuration error.
name: Desktop installers

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
            platform: mac
            arch: arm64
            artifact: macos-arm64
          - name: macOS x64
            runner: macos-15-intel
            platform: mac
            arch: x64
            artifact: macos-x64
          - name: Linux x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            artifact: linux-x64
          - name: Windows x64
            runner: windows-2025
            platform: windows
            arch: x64
            artifact: windows-x64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Verify the Windows workspace picker and desktop chrome
        if: matrix.platform == 'windows'
        shell: pwsh
        run: >-
          pnpm exec vitest run --config vitest.config.ts
          packages/host/directory-picker-native/tests/win32-dialog.spec.ts
          packages/host/directory-picker-native/tests/win32-dialog-host.spec.ts
          packages/host/directory-picker-native/tests/win32-dialog-bindings.spec.ts
          packages/host/directory-picker-native/tests/native-picker.spec.ts
          packages/client/ui-settings-general/tests/desktop-update.client.spec.tsx
          apps/desktop/tests/product.spec.ts

      - name: Build and stage the desktop runtime
        run: pnpm run desktop:prepare

      - name: Configure optional macOS signing and notarization
        if: matrix.platform == 'mac'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          secret_names=(
            MACOS_CERTIFICATE_P12_BASE64
            MACOS_CERTIFICATE_PASSWORD
            APPLE_API_KEY_P8
            APPLE_API_KEY_ID
            APPLE_API_ISSUER
          )
          configured=0
          missing=()
          for name in "${secret_names[@]}"; do
            if [[ -n "${!name}" ]]; then
              configured=$((configured + 1))
            else
              missing+=("${name}")
            fi
          done

          if [[ "${configured}" -eq 0 ]]; then
            {
              printf 'MACOS_SIGNING_CONFIGURED=false\n'
              printf 'CSC_IDENTITY_AUTO_DISCOVERY=false\n'
            } >> "${GITHUB_ENV}"
            echo 'No Apple credentials are configured; publishing an unsigned macOS package.'
            exit 0
          fi

          if [[ "${configured}" -ne "${#secret_names[@]}" ]]; then
            printf 'Incomplete macOS release credentials; missing:' >&2
            printf ' %s' "${missing[@]}" >&2
            printf '\n' >&2
            exit 1
          fi

          certificate_path="${RUNNER_TEMP}/developer-id-application.p12"
          api_key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "${MACOS_CERTIFICATE_P12_BASE64}" | openssl base64 -d -A -out "${certificate_path}"
          printf '%s' "${APPLE_API_KEY_P8}" > "${api_key_path}"
          chmod 600 "${certificate_path}" "${api_key_path}"

          {
            printf 'CSC_LINK=%s\n' "${certificate_path}"
            printf 'CSC_KEY_PASSWORD=%s\n' "${MACOS_CERTIFICATE_PASSWORD}"
            printf 'APPLE_API_KEY=%s\n' "${api_key_path}"
            printf 'APPLE_API_KEY_ID=%s\n' "${APPLE_API_KEY_ID}"
            printf 'APPLE_API_ISSUER=%s\n' "${APPLE_API_ISSUER}"
            printf 'MACOS_SIGNING_CONFIGURED=true\n'
          } >> "${GITHUB_ENV}"

      - name: Package the native installers
        run: node apps/desktop/scripts/package.mjs ${{ matrix.platform }} ${{ matrix.arch }}

      - name: Verify the signed and notarized macOS application
        if: matrix.platform == 'mac' && env.MACOS_SIGNING_CONFIGURED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find dist/desktop -type d -name 'DeepSeek Harness.app' -print -quit)"
          if [[ -z "${app_path}" ]]; then
            echo 'Packaged macOS application was not found' >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "${app_path}"
          spctl --assess --type execute --verbose=2 "${app_path}"
          xcrun stapler validate "${app_path}"

      - name: Report unsigned macOS package
        if: matrix.platform == 'mac' && env.MACOS_SIGNING_CONFIGURED != 'true'
        run: echo 'The macOS artifact is unsigned; follow the first-launch steps in README.md.'

      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-${{ matrix.artifact }}
          path: |
            dist/desktop/*.dmg
            dist/desktop/*.zip
            dist/desktop/*.AppImage
            dist/desktop/*.deb
            dist/desktop/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Attach installers to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/desktop/scripts/upload-release.mjs

      - name: Remove temporary macOS credentials
        if: always() && matrix.platform == 'mac'
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/developer-id-application.p12" "${APPLE_API_KEY:-${RUNNER_TEMP}/missing-api-key}"
